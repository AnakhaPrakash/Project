{% load static %}
{% block content %}
{% include 'header.html' %}
{% if messages%}
{% for message in messages %}
<script>
  alert('{{ message }}');
</script>
{% endfor %}
{% endif %}

<div class="page-banner overlay-dark bg-image" style="background-image: url({% static 'assets/img/bg_image_1.jpg' %});">
  <div class="banner-section">
      <div class="container text-center wow fadeInUp">
        <nav aria-label="Breadcrumb">
          <ol class="breadcrumb breadcrumb-dark bg-transparent justify-content-center py-0 mb-2">
            {% comment %} <li class="breadcrumb-item"><a href="index.html"></a></li>
            <li class="breadcrumb-item active" aria-current="page"></li> {% endcomment %}
          </ol>
        </nav>
        <h1 class="font-weight-normal"></h1>

    </div> <!-- .banner-section -->
  </div> <!-- .page-banner -->

  <div class="page-section">
    <div class="container">
      <h1 class="text-center wow fadeInUp">Feedback</h1>

      <form class="contact-form mt-5" method="POST" action="addfeedback">
        {% csrf_token %}
        <div class="row mb-3">
            <div class="col-sm-6 py-2 wow fadeInRight">
                <label for="emailAddress">Message</label>
                <input type="text" id="emailAddress" class="form-control" name="message" placeholder="Enter your Feedback..">
              </div>


          
          
        </div>
        <button type="submit" class="btn btn-primary wow zoomIn" name="submit">Submit</button>
      </form>
    </div>
  </div>
